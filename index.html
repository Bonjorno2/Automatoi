<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Automatori</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        grid-template-columns: 1fr 22rem;
        font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        background: #1e1e1e;
        color: #d4d4d4;
      }
      #editor { height: 100vh; min-width: 0; }
      #side {
        border-left: 1px solid #333;
        padding: 0.75rem;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }
      #status { margin: 0; color: #888; font-size: 11px; }
    </style>
  </head>
  <body>
    <div id="editor"></div>
    <aside id="side">
      <p id="status">starting…</p>
    </aside>
    <script type="module" src="/src/editor/main.ts"></script>
  </body>
</html>
