<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Automatori</title>
    <style>
      /*
        Milestone 7's Task 8. The page is a frame around the canvas, so it
        recedes: one accent, a type scale with three sizes instead of five
        ad-hoc ones, and spacing from a scale rather than from whatever looked
        right in the line being written.

        Nothing here changes what any control does, and no control moved. A
        restyle that relocates a button is a restyle that invalidates the
        milestone 3, 5 and 6 playtests.
      */
      :root {
        color-scheme: dark;
        /* Type: one step down for labels, one up for the few headings. */
        --fs-sm: 11px;
        --fs: 13px;
        --fs-lg: 15px;
        /* Space, doubling. Every margin and gap below is one of these. */
        --sp-1: 0.25rem;
        --sp-2: 0.5rem;
        --sp-3: 0.75rem;
        --sp-4: 1rem;
        /* Ink, darkest to lightest. */
        --bg: #16181a;
        --bg-sunk: #101214;
        --bg-raised: #1f2225;
        --line: #2c3033;
        --line-bright: #3a4045;
        --text: #cfd3d6;
        --text-dim: #7d858b;
        /* The one accent, taken from the crop gold the canvas already uses. */
        --accent: #f0d878;
        --accent-dim: #4a4326;
        --grow: #9be06a;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr) 22rem;
        font: var(--fs) / 1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        background: var(--bg);
        color: var(--text);
      }
      /* Pixi sizes its canvas to this element, so it must not be sized by it. */
      #world {
        position: relative;
        height: 100vh;
        min-width: 0;
        overflow: hidden;
        background: #12140f;
        border-right: 1px solid var(--line);
      }
      #world canvas { display: block; }
      #world .tooltip {
        position: absolute;
        pointer-events: none;
        white-space: pre;
        padding: var(--sp-1) 0.45rem;
        background: #12140fe6;
        border: 1px solid #4a5540;
        border-radius: 3px;
        color: #d9d9c8;
        font-size: var(--fs-sm);
        line-height: 1.35;
        z-index: 2;
      }
      #editor { height: 100vh; min-width: 0; }
      #side {
        border-left: 1px solid var(--line);
        padding: var(--sp-3);
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: var(--sp-3);
        background: var(--bg);
      }
      /* A masthead rather than a row of buttons at the top of a grey column.
         It carries the name and the one key binding nothing else mentions. */
      #masthead {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: var(--sp-2);
        margin: 0;
        padding-bottom: var(--sp-2);
        border-bottom: 1px solid var(--line);
      }
      #masthead h1 {
        margin: 0;
        font-size: var(--fs-lg);
        font-weight: 600;
        letter-spacing: 0.08em;
        color: var(--accent);
      }
      #masthead .camera-hint { font-size: var(--fs-sm); color: var(--text-dim); }
      #status {
        margin: 0;
        color: var(--text-dim);
        font-size: var(--fs-sm);
        min-height: 1.2em;
      }
      /* The armed banner. Loud on purpose: it is the answer to "why is my
         cursor a ghost", and it names the key that makes it stop. */
      #placing {
        margin: var(--sp-1) 0 0;
        padding: 0.15rem 0.4rem;
        color: #1a1a12;
        background: var(--accent);
        border-radius: 2px;
        font-size: var(--fs-sm);
      }
      #controls { display: flex; flex-wrap: wrap; gap: var(--sp-1); }
      button, select {
        font: inherit;
        font-size: var(--fs-sm);
        background: var(--bg-raised);
        color: var(--text);
        border: 1px solid var(--line-bright);
        border-radius: 3px;
        padding: 0.3rem 0.65rem;
        cursor: pointer;
        transition: background 90ms linear, border-color 90ms linear;
      }
      button:hover, select:hover { background: #2a2e32; border-color: #4c545a; }
      button:active { background: #14171a; }
      button:focus-visible, select:focus-visible {
        outline: 1px solid var(--accent);
        outline-offset: 1px;
      }
      button:disabled { opacity: 0.45; cursor: default; }
      /* Run is the one thing on this page a player presses over and over. */
      #run { border-color: var(--accent-dim); color: var(--accent); }
      #run:hover { background: #2a2618; border-color: var(--accent); }
      #panel { display: flex; flex-direction: column; gap: var(--sp-3); }
      .group { display: flex; flex-direction: column; gap: var(--sp-1); }
      .group-title {
        margin: 0;
        font-size: var(--fs-sm);
        font-weight: 400;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--text-dim);
      }
      .cargo { display: flex; align-items: center; gap: var(--sp-1); font-size: var(--fs-sm); }
      .cargo-label { color: var(--text-dim); min-width: 3.2rem; }
      .cargo-count { color: #9cdcfe; }
      .bar {
        flex: 1;
        height: 0.6rem;
        background: var(--bg-sunk);
        border: 1px solid var(--line);
        border-radius: 2px;
        overflow: hidden;
      }
      .bar i { display: block; height: 100%; background: #c8b84a; transition: width 120ms linear; }
      .bar i.full { background: #d8703c; }
      /* What the field has left. Amber rather than the research green: this is
         a supply that only ever goes down until the player plants something. */
      .field {
        margin: 0;
        padding: 0;
        list-style: none;
        font-size: var(--fs-sm);
        color: #c8b84a;
      }
      .research { margin: 0; padding: 0; list-style: none; font-size: var(--fs-sm); }
      .research .muted { color: var(--text-dim); }
      /* Progress, not a list. The words ride inside the bar so nothing is lost
         when the fraction is a sliver. */
      .research-row { margin-top: var(--sp-1); }
      .research-bar {
        position: relative;
        display: block;
        height: 1.35rem;
        background: var(--bg-sunk);
        border: 1px solid var(--line);
        border-radius: 2px;
        overflow: hidden;
      }
      .research-bar i {
        position: absolute;
        inset: 0 auto 0 0;
        display: block;
        background: #2f4a22;
        transition: width 140ms linear;
      }
      .research-row.active .research-bar i { background: #3c6329; }
      .research-text {
        position: relative;
        display: block;
        padding: 0 0.4rem;
        line-height: 1.25rem;
        color: var(--grow);
      }
      .research-row:not(.active) .research-text { color: var(--text-dim); }
      /* The build menu: things you own and have not placed. Styled as offers
         rather than as status, because clicking one is the whole point. */
      /* The fleet list: milestone 4's finding 6, in full at last. A row is a
         button because it selects a bot, and it carries the same colour swatch
         the canvas draws that bot with so the two cannot be told apart. */
      .fleet { margin: 0 0 var(--sp-1); padding: 0; list-style: none; }
      .fleet li { margin-top: 0.2rem; }
      .fleet button.fleet-row {
        display: flex;
        align-items: baseline;
        gap: 0.4rem;
        width: 100%;
        text-align: left;
        font-size: var(--fs-sm);
        color: var(--text);
        background: transparent;
        border: 1px solid transparent;
      }
      .fleet button.fleet-row:hover { background: #24261c; border-color: #3a3d2d; }
      .fleet button.fleet-row.selected { background: #2a2d20; border-color: var(--accent-dim); }
      .fleet-swatch {
        flex: none;
        width: 0.6rem;
        height: 0.6rem;
        border-radius: 2px;
        border: 1px solid #141409;
      }
      .fleet-name { flex: none; }
      .fleet-what {
        color: var(--text-dim);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .build { margin: 0; padding: 0; list-style: none; }
      .build li { margin-top: 0.2rem; }
      .build button {
        display: block;
        width: 100%;
        text-align: left;
        font-size: var(--fs-sm);
        color: var(--accent);
        background: #2a2618;
        border: 1px solid var(--accent-dim);
      }
      .build button:hover { background: #3a3420; border-color: #6a5f36; }
      .build button.build-active {
        background: var(--accent-dim);
        border-color: var(--accent);
        color: #fff;
      }
      /* Remove is a tool, not stock. Quieter than the offers above it and a
         different colour, so the list does not read as one more thing to spend. */
      .build button.build-remove {
        margin-top: 0.4rem;
        color: #c89a90;
        background: #241b1a;
        border-color: #452e2a;
      }
      .build button.build-remove:hover { background: #342523; }
      .build button.build-remove.build-active {
        background: #452e2a;
        border-color: #c89a90;
        color: #fff;
      }
      #log {
        margin: 0;
        padding: var(--sp-2);
        list-style: none;
        background: var(--bg-sunk);
        border: 1px solid var(--line);
        border-radius: 3px;
        flex: 1;
        min-height: 8rem;
        overflow-y: auto;
        font-size: 12px;
      }
      #log li { padding: 0.1rem 0; border-bottom: 1px solid #1c1f21; }
      #log li:last-child { border-bottom: 0; }
      .hint { color: var(--text-dim); font-size: var(--fs-sm); margin: 0; }
      /*
        The codebook. It lives in the column rather than floating over the
        canvas, because the chip the game offers is a chip of this book and the
        offer must not be a thing that appears and vanishes — the player has to
        be able to come back to it. A floating panel cannot be both.
      */
      #codebook { max-height: 60vh; overflow-y: auto; }
      .chip {
        display: block;
        width: 100%;
        text-align: left;
        margin-top: var(--sp-1);
        padding: 0.4rem 0.5rem;
        background: var(--bg-raised);
        border: 1px solid var(--line);
      }
      .chip:hover { background: #2a2e32; border-color: var(--line-bright); }
      .chip strong { color: #dcdcaa; }
      .chip-need {
        color: #c586c0;
        font-style: normal;
        font-size: 10px;
        margin-left: var(--sp-1);
      }
      .chip-blurb { display: block; color: var(--text-dim); font-size: 10px; margin: 0.15rem 0 0.3rem; }
      .chip pre {
        margin: 0;
        padding: 0.3rem 0.4rem;
        background: var(--bg-sunk);
        border-radius: 3px;
        color: #9cdcfe;
        font-size: 10px;
        white-space: pre-wrap;
        overflow-x: auto;
      }
      /* One line, for a chip the player has already been shown once. */
      .chip-compact { padding: 0.25rem 0.5rem; font-size: var(--fs-sm); }
      /* What the game is offering right now: the accent the build menu uses for
         its offers, because that is what this is. */
      .chip-suggest {
        border-color: var(--accent-dim);
        background: #24211a;
      }
      .chip-suggest:hover { background: #2f2a1d; border-color: var(--accent); }
      .book-why { margin: var(--sp-1) 0 0; color: var(--accent); font-size: var(--fs-sm); }
      .book-label {
        margin: var(--sp-2) 0 0;
        font-size: 10px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--text-dim);
      }
      .book-hint { margin-top: var(--sp-1); font-size: 10px; }
      /* Quieter than the offer it refuses, and always the same one click. */
      .suggest-dismiss {
        margin-top: var(--sp-1);
        padding: 0.15rem 0.4rem;
        font-size: 10px;
        color: var(--text-dim);
        background: transparent;
        border-color: var(--line);
      }
    </style>
  </head>
  <body>
    <div id="world"></div>
    <div id="editor"></div>
    <aside id="side">
      <header id="masthead">
        <h1>AUTOMATORI</h1>
        <span class="camera-hint">wheel zooms · space-drag pans · Home resets</span>
      </header>
      <div id="controls">
        <button id="run" type="button">Run</button>
        <button id="stop" type="button">Stop</button>
        <button id="pause" type="button">Pause</button>
        <button id="step" type="button">Step</button>
        <button id="book-toggle" type="button">Book</button>
        <button id="library" type="button" hidden>Library</button>
        <select id="speed" aria-label="Speed">
          <option value="0.5">0.5x</option>
          <option value="1" selected>1x</option>
          <option value="2">2x</option>
          <option value="4">4x</option>
        </select>
      </div>
      <p class="hint">Ctrl+S restarts this bot's script.</p>
      <div id="panel"></div>
      <!-- Above the console and below the panel: the console is what the bot
           said, and this is what the game has to say about it. One section, not
           two — the chip the game offers is a chip of this book, and this is
           where the player comes back for it. -->
      <section class="group" id="codebook"></section>
      <ul id="log"></ul>
      <p id="status">starting…</p>
      <p id="placing" hidden></p>
    </aside>
    <script type="module" src="/src/editor/main.ts"></script>
  </body>
</html>
